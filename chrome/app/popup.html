<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 160px; padding: 12px; font-family: sans-serif; background: #222; color: #fff; margin: 0; }
    button { width: 100%; padding: 10px; margin-bottom: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
    button:hover { background: #0056b3; }
    button:last-child { margin-bottom: 0; }
    .secondary { background: #555; }
    .secondary:hover { background: #444; }
  </style>
</head>
<body>
  <button id="btn-toggle">Toggle Overlay</button>
  <button id="btn-settings" class="secondary">Open Settings</button>
  <script src="popup.js"></script>
</body>
</html>
